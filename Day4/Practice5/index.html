<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Analysis Tool</title>
</head>

<body>
    <h2>Number Analysis Tool</h2>
    <script>
        let num = prompt("Enter a number:");
        num = parseFloat(num);
        let result = (num >= 0) ? "Positive Number" : "Negative Number";
        alert(result);
        if (num % 2 === 0) {
            alert("Even Number");
        } else {
            alert("Odd Number");
        }

        alert("Counting from 1 to " + num);

        for (let i = 1; i <= num; i++) {
            alert(i);
        }
    </script>
</body>

</html>
