<h2>Add Contact</h2>

<form (ngSubmit)="addContact()">
    <input type="text" [(ngModel)]="contact.name" name="name" placeholder="Name" required>
    <br>
    <br>
    <input type="email" [(ngModel)]="contact.email" name="email" placeholder="Email" required>
    <br>
    <br>
    <input type="text" [(ngModel)]="contact.phone" name="phone" placeholder="Phone" required>
    <br>
    <br>

    <button type="submit">Add Contact</button>
</form>
