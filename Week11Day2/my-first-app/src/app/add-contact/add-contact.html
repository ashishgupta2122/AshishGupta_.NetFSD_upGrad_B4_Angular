<div class="form-container">

    <h2>Add Contact</h2>

    <form #contactForm="ngForm" (ngSubmit)="addContact()" class="form">

        <!-- Name -->
        <div class="form-group">
            <label>Name</label>
            <input type="text" name="name" ngModel placeholder="Enter Name" required>
        </div>

        <!-- Email -->
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" ngModel placeholder="Enter Email" required>
        </div>

        <!-- Phone -->
        <div class="form-group">
            <label>Phone</label>
            <input type="text" name="phone" ngModel placeholder="Enter Phone" required>
        </div>

        <!-- Status -->
        <div class="form-group checkbox">
            <label>
                <input type="checkbox" name="isActive" ngModel>
                Active
            </label>
        </div>

        <button type="submit">Add Contact</button>

    </form>

</div>
