<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Grocery Checklist</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 6px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        h2 {
            color: #34495e;
            margin-top: 25px;
        }

        ol,
        ul {
            margin-left: 30px;
        }

        li {
            margin: 6px 0;
            color: #333;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 title="weekly Grocery Checklist">Weekly Grocery Checklist</h1>

        <h2>High Priority Items</h2>
        <ol>
            <li>Rice</li>
            <li>Mill</li>
            <li>Vegetable</li>
            <li>Coding Oil</li>
        </ol>

        <h2>Optional Items</h2>
        <ul>
            <li>Snacks</li>
            <li>Ice Cream</li>
            <li>Soft Drinks</li>
        </ul>
    </div>
</body>

</html>
