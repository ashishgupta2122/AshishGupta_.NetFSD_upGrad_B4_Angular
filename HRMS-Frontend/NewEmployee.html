<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Employee</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <h2>Add Employee</h2>

    <form id="employeeForm">

        <input type="text" id="firstName" placeholder="First Name" required>

        <input type="text" id="lastName" placeholder="Last Name" required>

        <input type="date" id="dob" required>

        <select id="gender" required>
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
        </select>

        <input type="email" id="personalEmail" placeholder="Personal Email" required>

        <input type="tel" id="mobile" placeholder="Mobile Number" required>

        <input type="text" id="street" placeholder="Street">

        <input type="text" id="city" placeholder="City">

        <input type="text" id="state" placeholder="State">

        <input type="text" id="country" placeholder="Country">

        <input type="text" id="zip" placeholder="Zip Code">

        <input type="date" id="doj">

        <input type="email" id="officeEmail" placeholder="Office Email">

        <input type="text" id="department" placeholder="Department">

        <input type="text" id="skills" placeholder="Skills (comma separated)">

        <label>
            <input type="checkbox" id="isActive">
            Active Employee
        </label>

        <button type="submit">Save Employee</button>

    </form>

    <script src="js/app.js"></script>

</body>

</html>
