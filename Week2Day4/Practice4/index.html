<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Landing</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bs-primary: #6f42c1;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">ShopX</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>


            <div class="offcanvas offcanvas-end text-bg-dark" id="menu">
                <div class="offcanvas-header">
                    <h5>Menu</h5>
                    <button class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
                </div>

                <div class="offcanvas-body">
                    <ul class="navbar-nav">
                        <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Products</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <section class="bg-light text-center py-5">
        <div class="container">
            <h1 class="fw-bold">Welcome to ShopX</h1>
            <p class="lead">Best deals on electronics</p>
            <button class="btn btn-primary">Shop Now</button>
        </div>
    </section>


    <div id="carouselExample" class="carousel slide container my-5" data-bs-ride="carousel">

        <div class="carousel-inner">

            <div class="carousel-item active">
                <img src="https://via.placeholder.com/900x300" class="d-block w-100">
            </div>

            <div class="carousel-item">
                <img src="https://via.placeholder.com/900x300" class="d-block w-100">
            </div>

            <div class="carousel-item">
                <img src="https://via.placeholder.com/900x300" class="d-block w-100">
            </div>

        </div>

        <button class="carousel-control-prev" data-bs-target="#carouselExample" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>

        <button class="carousel-control-next" data-bs-target="#carouselExample" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>

    </div>
    <section class="container py-5">
        <h2 class="text-center mb-4">Featured Products</h2>

        <div class="row g-4">

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100">
                    <img src="https://via.placeholder.com/200" class="card-img-top">
                    <div class="card-body text-center">
                        <h5>Smartphone</h5>
                        <p>₹15,999</p>
                        <button class="btn btn-primary w-100">Buy Now</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100">
                    <img src="https://via.placeholder.com/200" class="card-img-top">
                    <div class="card-body text-center">
                        <h5>Laptop</h5>
                        <p>₹55,000</p>
                        <button class="btn btn-primary w-100">Buy Now</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100">
                    <img src="https://via.placeholder.com/200" class="card-img-top">
                    <div class="card-body text-center">
                        <h5>Headphones</h5>
                        <p>₹2,999</p>
                        <button class="btn btn-primary w-100">Buy Now</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100">
                    <img src="https://via.placeholder.com/200" class="card-img-top">
                    <div class="card-body text-center">
                        <h5>Smartwatch</h5>
                        <p>₹3,499</p>
                        <button class="btn btn-primary w-100">Buy Now</button>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <section class="bg-dark text-white py-5">
        <div class="container text-center">
            <h3>Subscribe to our Newsletter</h3>

            <form class="row justify-content-center mt-3">
                <div class="col-md-6">
                    <input type="email" class="form-control mb-2" placeholder="Enter your email">
                </div>
                <div class="col-md-2">
                    <button class="btn btn-primary w-100">Subscribe</button>
                </div>
            </form>

        </div>
    </section>

    <footer class="bg-light text-center py-3">
        <p class="mb-0">© 2026 ShopX | All Rights Reserved</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
