<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Listing</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-4 text-center">
        <h1 class="fw-bold">Electronics Store</h1>
        <p class="text-muted">Explore our latest gadgets</p>
    </div>


    <div class="container pb-5">
        <div class="row g-4">

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 shadow-sm">
                    <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Product">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">Smartphone</h5>
                        <p class="card-text text-muted">Latest Android smartphone</p>
                        <p class="fw-bold">₹15,999</p>
                        <div class="mt-auto">
                            <button class="btn btn-primary w-100 mb-2">Add to Cart</button>
                            <button class="btn btn-outline-secondary w-100">View Details</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 shadow-sm">
                    <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Product">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">Laptop</h5>
                        <p class="card-text text-muted">High performance laptop</p>
                        <p class="fw-bold">₹55,000</p>
                        <div class="mt-auto">
                            <button class="btn btn-primary w-100 mb-2">Add to Cart</button>
                            <button class="btn btn-outline-secondary w-100">View Details</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 shadow-sm">
                    <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Product">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">Headphones</h5>
                        <p class="card-text text-muted">Noise cancelling headphones</p>
                        <p class="fw-bold">₹2,999</p>
                        <div class="mt-auto">
                            <button class="btn btn-primary w-100 mb-2">Add to Cart</button>
                            <button class="btn btn-outline-secondary w-100">View Details</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 shadow-sm">
                    <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Product">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">Smartwatch</h5>
                        <p class="card-text text-muted">Fitness tracking smartwatch</p>
                        <p class="fw-bold">₹3,499</p>
                        <div class="mt-auto">
                            <button class="btn btn-primary w-100 mb-2">Add to Cart</button>
                            <button class="btn btn-outline-secondary w-100">View Details</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
