<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Enrollment Form</title>
</head>

<body>
    <h1>Course Enrollment Form</h1>

    <section>
        <h3>Enrollment Progress</h3>
        <progress value="50" max="100">
            <p>50% Completed</p>
        </progress>
    </section>

    <form>
        <section>
            <label for="email">Email Address:</label>
            <br>
            <input type="email" id="email" name="email" required>
        </section>
        <br>
        <section>
            <label for="course">Select Course:</label>
            <br>
            <input list="courses" name="courses" id="course" required>

            <datalist id="courses">
                <option value="Introduction to Programming">
                <option value="Web Development Basics">
                <option value="Data Science Fundamentals">
                <option value="Machine Learning 101">
            </datalist>
        </section>
        <br>
        <section>
            <label>Skill Level:</label>
            <br>
            <meter min="0" max="100" value="40"></meter>
            <p>Beginner to Advanced</p>
        </section>
        <br>

        <section>
            <label for="experience">Experience Level (Years):</label>
            <br>
            <input type="range" id="experience" name="experience" min="0" max="10">
        </section>
        <br>

        <section>
            <label for="count">Number of Courses Enrolling:</label><br>
            <input type="number" id="count" name="count" min="1" max="5" required>
        </section>
        <br>
        <section>
            <input type="submit" value="Enroll Now">
        </section>
    </form>
</body>

</html>
