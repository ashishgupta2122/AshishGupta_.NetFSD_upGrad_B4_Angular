<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Notes Saver</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h2>Personal Notes Saver</h2>
        <textarea id="noteArea" placeholder="Write your notes here..."></textarea>


        <div class="buttons">
            <button class="save-btn" onclick="saveNote()">Save</button>
            <button class="clear-btn" onclick="clearNote()">Clear</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
