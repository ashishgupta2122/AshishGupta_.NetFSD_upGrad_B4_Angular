<!DOCTYPE html>
<html>

<head>

    <title>Manage Events</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="container mt-4">

        <h3>Manage Events</h3>

        <button onclick="logout()" class="btn btn-danger float-end">
            Logout
        </button>

        <h5 class="mt-4">Add Event</h5>

        <form onsubmit="addEvent(event)">

            <input id="eventId" class="form-control" placeholder="Event ID" required>

            <input id="eventName" class="form-control" placeholder="Event Name" required>

            <select id="category" class="form-control">

                <option>Tech & Innovations</option>
                <option>Industrial Event</option>

            </select>

            <input id="date" type="date" class="form-control" required>

            <input id="time" type="time" class="form-control" required>

            <input id="url" type="url" class="form-control" placeholder="Event URL" required>

            <button class="btn btn-success">Add Event</button>

        </form>

        <hr>

        <h5>Search Event</h5>

        <input id="searchInput" class="form-control mb-3" placeholder="Search by name or category"
            onkeyup="searchEvents()">

        <div class="row" id="eventsList"></div>

    </div>

    <script src="js/db.js"></script>
    <script src="js/events.js"></script>
    <script src="js/auth.js"></script>

</body>

</html>
