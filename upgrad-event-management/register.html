<!DOCTYPE html>
<html>

<head>

    <title>Event Registration</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

</head>

<body>

    <div class="container mt-5">

        <h3>Event Registration</h3>

        <div id="eventDetails" class="card p-3 mb-4"></div>

        <h5>Participant Details</h5>

        <form id="registerForm">

            <input class="form-control" placeholder="First Name" required>

            <input class="form-control" placeholder="Last Name" required>

            <input type="email" class="form-control" placeholder="Email" required>

            <button class="btn btn-success mt-2">Register</button>

        </form>

    </div>

    <script src="js/db.js"></script>
    <script src="js/register.js"></script>

</body>

</html>
