<!DOCTYPE html>
<html>

<head>

    <title>Contact Us</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

</head>

<body>

    <nav class="navbar navbar-dark bg-primary">

        <div class="container">

            <a class="navbar-brand">Upgrad Events</a>

        </div>

    </nav>

    <div class="container mt-5">

        <h3 class="text-center">Contact Us</h3>

        <form id="contactForm" class="col-md-6 mx-auto">

            <input class="form-control mb-3" placeholder="Name" required>

            <input type="email" class="form-control mb-3" placeholder="Email" required>

            <textarea class="form-control mb-3" placeholder="Description" required></textarea>

            <button class="btn btn-primary w-100">
                Submit Query
            </button>

        </form>

    </div>

    <script src="js/contact.js"></script>

</body>

</html>
